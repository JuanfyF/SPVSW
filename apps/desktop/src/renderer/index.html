<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP (OWASP A05): en producción la app carga por file:// y el header
      onHeadersReceived de main.ts NO aplica (no hay respuesta HTTP); esta
      meta es la única protección real. Debe mantenerse sincronizada con el
      header de electron/main.ts (frame-ancestors solo vive en el header:
      los meta lo ignoran).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'"
    />
    <title>Sweet Bakery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0; background-color:#FFF9F2;">
    <div id="root" style="height:100%;"></div>
    <script type="module" src="./browser-shim.ts"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

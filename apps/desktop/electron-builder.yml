appId: com.sweetbakery.pos
productName: Sweet Bakery
directories:
  output: release
  buildResources: build
asar: false
npmRebuild: false
files:
  - dist-electron/**/*
  - dist/**/*
  - node_modules/**/*
extraResources:
  - from: ../../packages/db/drizzle
    to: drizzle
afterPack: scripts/after-pack.js
linux:
  target:
    - AppImage
  category: Utility
  icon: public/icon.png
  executableArgs:
    - --in-process-gpu
    - --no-sandbox
  artifactName: "${productName}-${version}.${ext}"
win:
  target:
    - nsis
  icon: public/icon.png
  artifactName: "${productName}-${version}-Setup.${ext}"
mac:
  target:
    - dmg
  icon: public/icon.png
  artifactName: "${productName}-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/icon.png
  uninstallerIcon: public/icon.png

appId: com.sweetbakery.pos
productName: Sweet Bakery
# builder ≥26 rechaza "@posdesktop" (el "@" no es seguro en rutas).
# El nombre de userData NO cambia: sigue derivando de name/@pos/desktop.
executableName: posdesktop
directories:
  output: release
  buildResources: build
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
publish:
  provider: github
  owner: JuanfyF
  repo: SPVSW
files:
  - dist-electron/**/*
  - dist/**/*
  - node_modules/**/*
extraResources:
  - from: ../../packages/db/drizzle
    to: drizzle
afterPack: scripts/after-pack.js
linux:
  target:
    - AppImage
  category: Utility
  icon: public/icon.png
  executableArgs:
    - --in-process-gpu
  artifactName: "${productName}-${version}.${ext}"
win:
  target:
    - nsis
  icon: public/icon.png
  artifactName: "${productName}-${version}-Setup.${ext}"
mac:
  target:
    - dmg
  icon: public/icon.png
  artifactName: "${productName}-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true

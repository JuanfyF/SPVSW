name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FUSE for AppImage tooling
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build Electron main process
        run: pnpm --filter @pos/desktop build:main

      - name: Build renderer
        run: pnpm --filter @pos/desktop build:renderer

      - name: Rebuild native modules
        run: pnpm --filter @pos/desktop exec electron-rebuild -f -w better-sqlite3

      - name: Build AppImage
        run: pnpm --filter @pos/desktop exec electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch AppImage
        run: bash apps/desktop/scripts/patch-appimage.sh apps/desktop/release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron main process
        run: pnpm --filter @pos/desktop build:main

      - name: Build renderer
        run: pnpm --filter @pos/desktop build:renderer

      - name: Rebuild native modules
        run: pnpm --filter @pos/desktop exec electron-rebuild -f -w better-sqlite3

      - name: Build NSIS installer
        run: pnpm --filter @pos/desktop exec electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Fix update manifests (filename + sha512 must match actual assets)
        run: |
          fix_yml() {
            local yml="$1" dir="$2" pattern="$3"
            local file
            file="$(find "$dir" -maxdepth 1 -name "$pattern" -type f | head -1)"
            if [ -f "$yml" ] && [ -f "$file" ]; then
              local filename sha512 size
              filename="$(basename "$file")"
              sha512="$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
              size="$(stat -c%s "$file")"
              sed -i "s|url: .*|url: $filename|" "$yml"
              sed -i "s|path: .*|path: $filename|" "$yml"
              sed -i "s|sha512: .*|sha512: $sha512|" "$yml"
              sed -i "s|size: .*|size: $size|" "$yml"
              sed -i "/blockMapSize/d" "$yml"
              echo "Fixed $yml -> $filename (sha512=${sha512:0:16}..., size=$size)"
            else
              echo "SKIP: yml=$yml file=$file"
            fi
          }
          fix_yml artifacts/windows-installer/latest.yml \
                   artifacts/windows-installer "Sweet*Bakery*Setup.exe"
          fix_yml artifacts/linux-appimage/latest-linux.yml \
                   artifacts/linux-appimage "*.AppImage"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-appimage/*
            artifacts/windows-installer/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
